2026:
  - date: 2026-10-06
    items:
      - "Report Zboží na skladu dle použitých jednotek má u každého zboží odkaz Změnit jednotku pro uživatele, kteří smějí měnit jednotku zboží."
      - "Při přidávání nebo úpravě zboží na výdejce či příjemce se po výběru zboží předvyplní Jednotka podle skladové jednotky zboží."
  - date: 2026-10-04
    items:
      - >-
        <strong>Nové funkce pro uživatele</strong>
        <ul>
          <li><a href='{% url 'kitchen:docs' %}'>Příručka</a> je přepsaná jako příběh od dodavatele až na talíř: obsah, kapitoly podle rolí s kroky a tipy „Dobré vědět“, sekce Když něco nejde a odkaz na novinky. Datový model a přehled objemu dat obsahují nové tabulky menu, recepty v menu, změny jednotek a nastavení.</li>
          <li>Správa jednotek umožňuje řízenou změnu jednotky zboží i převod jedné suroviny v receptu. Změna zboží přepočte zásoby, minimální zásobu, suroviny v receptech a řádky všech příjemek a výdejek včetně schválených; celková hodnota skladu a údaje o schválení zůstanou beze změny.</li>
          <li>Před převodem se zobrazí náhled s příklady, koeficientem v obou směrech, varováními a rozdíly zaokrouhlení dokladů. Zdroj koeficientu je povinný, varování vyžadují potvrzení. Poslední změnu lze přesně vrátit, pokud se související data od té doby nezměnila.</li>
          <li>Správa jednotek je dostupná z profilu a uživatelské nabídky, úpravy zboží a seznamů zboží a surovin receptu. Report nesprávných jednotek nabízí samostatné odkazy na změnu jednotky suroviny a zboží, také u příjemek a výdejek. Odkazy i akce respektují role uživatele.</li>
          <li>Formuláře příjemek a výdejek zobrazují skladovou jednotku u názvu zboží. Nápověda na skladové kartě odkazuje na tlačítko Změnit jednotku; pokud recept nemá jinou použitelnou jednotku, stránka nabídne oprávněnému uživateli změnu jednotky zboží.</li>
          <li>Zboží v ks má hmotnost kusu v g nebo ml. Výživové údaje se zadávají na 100 g / 100 ml; recepty a denní menu přepočítávají kusy podle této hmotnosti. Chybějící hmotnost je označena jako neúplný výživový údaj a upozornění v seznamu zboží.</li>
          <li>Zboží se záporným množstvím nebo celkovou cenou je v seznamu skladu i jeho PDF zvýrazněno červeně a výstražnou ikonou.</li>
        </ul>
      - >-
        <strong>Opravy chyb</strong>
        <ul>
          <li>Naskladnění a vyskladnění už nepřevádí jednotkovou cenu podruhé při odlišné jednotce řádku a skladu (chyba mohla změnit hodnotu 1000krát).</li>
          <li>Jednotkové ceny se ukládají na 4 desetinná místa a zobrazují na 2, také v tabulce náhledu převodu. Levné zboží nebo zboží v g a ml už neztrácí cenu zaokrouhlením na celé koruny.</li>
          <li>Vyskladnění nejprve aktualizuje ceny a poté je kontroluje. Zamítnutí ponechá původní ceny výdejky i stav skladu beze změny.</li>
          <li>Kontrola zásob sčítá stejné zboží ze všech řádků a používá stejná zaokrouhlená množství jako odpis, i při různých jednotkách.</li>
          <li>Při tvorbě výdejky z denního menu se množství stejného zboží nejprve sečtou a potom zaokrouhlí. Malé příspěvky z více receptů se neztratí; řádky se součtem zaokrouhleným na nulu se vynechají.</li>
          <li>Celková cena výdejky je součtem zaokrouhlených řádků a odpovídá změně hodnoty skladu. Měsíční report příjemek a výdejek už není o 1 Kč nižší a pro prázdný měsíc ukazuje 0.</li>
          <li>Náklady receptu zachovávají přesnost jednotlivých surovin a zaokrouhlují až zobrazený součet. Recept musí mít alespoň jednu porci; minimální množství suroviny v receptu a na příjemce je 0,01, stejně jako na výdejce.</li>
          <li>Data naskladnění, vyskladnění a založení příjemky používají místní čas aplikace. Export skladu přijímá dnešní datum i kolem půlnoci a odmítá budoucí datum.</li>
          <li>Historický export už neselže na nepřevoditelné jednotce. Pokud nelze stav určit, ponechá množství a cenu zboží prázdné; upozornění a sloupec export_warning označí dotčené doklady a řádky.</li>
          <li>Čištění dat dokončí mazání historických záznamů bez chyby. Skladovou kartu nelze odstranit, pokud má zásobu nebo řádky na příjemkách či výdejkách, aby nezmizely i historické doklady.</li>
          <li>Aktualizace výdejky z denního menu funguje v češtině i angličtině a zachovává původního autora. Opravena konfigurace společné části aplikace.</li>
          <li>Formuláře zboží, surovin receptu, příjemek a výdejek odmítají staré hodnoty po změně jednotky. Chybějící kontrolní údaj ochranu neobejde a opakované odeslání odmítnutého řádku neuloží původní množství či cenu bez nového zadání.</li>
          <li>Potvrzení náhledu a přesné vrácení převodu kontrolují skutečné hodnoty souvisejících dat, nejen čas změny. Novější ceny, množství, údaje dokladů a vstupy receptu se nepřepíšou; kontrola funguje i po obnově zálohy.</li>
          <li>Vrácení převodu s nejmenším koeficientem 0,000001 už nevytvoří nečitelný auditní záznam. Zpětný koeficient se nepředvyplní, pokud mezitím došlo ke změně výchozí jednotky nebo vazeb suroviny.</li>
        </ul>
      - >-
        <strong>Bezpečnost</strong>
        <ul>
          <li>Profil uživatele vidí jen jeho vlastník a administrátor.</li>
          <li>Názvy zboží, receptů a poznámky se ve zprávách aplikace zobrazují jako text, nikoli jako HTML.</li>
          <li>Import úplné zálohy už neukládá soubor databáze do veřejného adresáře médií.</li>
          <li>Lokální databáze a staré soubory záloh se nezahrnují do sestavení Docker image.</li>
        </ul>
      - >-
        <strong>Administrace</strong>
        <ul>
          <li>V administraci ani jejím importem nelze měnit nebo mazat schválené příjemky, výdejky a jejich řádky ani přímo měnit příznak schválení. Tyto zásahy by nepřepočítaly sklad.</li>
          <li>Použitou sazbu DPH nelze smazat; procento DPH na schválených příjemkách nelze změnit v administraci ani jejím importem.</li>
          <li>Přímá změna jednotky existujícího zboží zůstává blokována v běžné úpravě, administraci i importu seznamu zboží. Používá se řízený převod; import úplné zálohy nadále načítá jednotky ze souboru beze změny.</li>
          <li>Záznamy změn jednotek lze v administraci prohlížet, filtrovat a vyhledávat, nikoli ručně přidávat, měnit nebo mazat.</li>
          <li>Superuživatel může upravovat skladové i výživové údaje bez zařazení do skupin. Příjemky a výdejky brání smazání uživatele, který je vytvořil nebo schválil.</li>
          <li>Údržba dat maže příjemky a výdejky podle data schválení (rok před dvěma lety a starší) a denní menu podle jeho data; neschválené doklady ponechá. Upozorňuje na omezení historických exportů před vymazaným obdobím.</li>
        </ul>
